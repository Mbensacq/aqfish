@if (!capture) {
  <!-- Interface (masquée en mode capture). Titre accessible, invisible à l'écran. -->
  <h1 class="visually-hidden">aqfish</h1>
  <!-- Aide-mémoire des commandes (#74), indépendant de Three.js : affiché tout de suite.
       Exclusif avec « Réglages » sur écran étroit (#136). -->
  <app-commands-help #help (opened)="onHelpOpened()" />
}
<!-- Three.js est chargé à part pour garder le bundle initial sous le budget (angular.json). -->
@defer (on immediate) {
  <app-aquarium-host #aquarium />
  @if (!capture) {
    <app-view-presets-bar
      [activePreset]="aquarium.activePreset()"
      [pixelArt]="aquarium.filter() === 'pixel'"
      (presetSelected)="aquarium.goToPreset($event)"
      (pixelArtToggled)="aquarium.toggleFilter()"
      (clockToggled)="aquarium.toggleClock()"
      (clockFrozenAt)="aquarium.freezeClockAt($event)"
      (fed)="aquarium.feedAtCenter()"
      (rainToggled)="aquarium.toggleRain()"
    />
    <!-- Indicateur du moment de la journée (#73). -->
    <app-day-indicator [phase]="aquarium.dayPhase()" />
    <!-- Panneau de contrôle (#52) : environnement (#87), vitesse, heure et pluie (#106), décor et granulés (#117), population (#69), sauvegarde (#70). Fermé par défaut. -->
    <app-control-panel
      #panel
      (opened)="onPanelOpened()"
      [environment]="aquarium.environment()"
      [speed]="aquarium.speed()"
      [hour]="aquarium.clockHour()"
      [clockRunning]="!aquarium.clockFrozen()"
      [decorVisible]="aquarium.decorVisible()"
      [rain]="aquarium.rain()"
      [foodStyle]="aquarium.foodStyle()"
      [population]="aquarium.population()"
      [populationMax]="aquarium.populationMax()"
      [saveStatus]="aquarium.saveStatus()"
      [saveMessage]="aquarium.saveMessage()"
      (environmentChanged)="aquarium.setEnvironment($event)"
      (speedChanged)="aquarium.setSpeed($event)"
      (hourChanged)="aquarium.freezeClockAt($event)"
      (clockRunningChanged)="aquarium.setClockRunning($event)"
      (decorVisibleChanged)="aquarium.setDecorVisible($event)"
      (rainChanged)="aquarium.setRain($event)"
      (foodStyleToggled)="aquarium.toggleFoodStyle()"
      (populationChanged)="aquarium.setPopulation($event.species, $event.count)"
      (exportRequested)="aquarium.exportSave()"
      (importRequested)="aquarium.importSave($event)"
      (importRejected)="aquarium.rejectImport($event)"
    />
  }
}
