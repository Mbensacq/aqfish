# Retire les pieds de page d'attribution des textes GitHub du dépôt (CLAUDE.md, « Règles
# Git » : tout le projet est au nom de Mathis). L'environnement des agents ajoute ces pieds à
# chaque création ou modification d'issue, de PR ou de commentaire ; les agents ne peuvent pas
# les retirer eux-mêmes (le pied revient à chaque modification qu'ils font). Ce workflow les
# retire côté GitHub, avec le jeton d'Actions :
# - à chaque création ou modification (texte de l'événement) ;
# - chaque heure, sur les textes déjà publiés, par lots (limites de l'API) ;
# - à la demande, avec les avis de revue en option.
# Les modifications faites avec le jeton d'Actions ne déclenchent pas de nouvelle exécution.
# Le script et ses tests : `.github/scripts/nettoyer-mentions.mjs`.
name: Nettoyage des mentions

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
    inputs:
      budget:
        description: 'Nombre maximal de textes corrigés (textes déjà publiés)'
        default: '300'
      avis:
        description: 'Parcourir aussi les avis de revue de toutes les PR (true / false)'
        default: 'false'

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: nettoyage-mentions-${{ github.event_name == 'schedule' && 'arriere' || github.run_id }}
  cancel-in-progress: false

jobs:
  nettoyer:
    name: nettoyer les textes
    # Pas sur les PR venant d'un dépôt dérivé : on ne touche qu'aux textes du dépôt.
    if: >-
      github.event_name != 'pull_request_target' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      # Seul le script est lu, depuis la branche par défaut : aucun code de PR n'est exécuté.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Texte de l'événement
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/nettoyer-mentions.mjs evenement

      - name: Textes déjà publiés
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUDGET: ${{ inputs.budget || '300' }}
          AVIS: ${{ inputs.avis == 'true' && '--avis' || '' }}
        run: node .github/scripts/nettoyer-mentions.mjs arriere "$BUDGET" $AVIS
