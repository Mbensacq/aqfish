name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Les tests de bout en bout (rendu WebGL logiciel, un seul worker) sont répartis sur
# plusieurs machines en parallèle (`--shard`). L'application est construite une seule fois
# (`build-e2e`) puis servie telle quelle par chaque part et par les captures
# (`scripts/servir-dist.mjs`, variable `E2E_DIST`). Le job `frontend` regroupe les résultats :
# c'est le contrôle exigé par la protection de `main`, son nom ne doit pas changer.
jobs:
  verifier:
    name: formatage, lint, tests unitaires, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Formatage
        run: npm run format:check

      - name: Lint (frontières, déterminisme, limites de qualité, cycles d'import)
        run: npm run lint

      - name: Tests unitaires avec couverture
        run: npm run test:coverage

      - name: Tests des scripts du dépôt (.github/scripts)
        run: node --test ../.github/scripts/*.test.mjs

      - name: Build de production
        run: npm run build

  build-e2e:
    name: build pour les tests de bout en bout
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      # Configuration de développement : le mode développement d'Angular reste actif, ses
      # contrôles (changements détectés après coup…) écrivent dans la console que les tests
      # lisent, comme avec `ng serve`.
      - name: Build de développement
        run: npx ng build --configuration development

      - name: Transmettre le build aux tests
        uses: actions/upload-artifact@v7
        with:
          name: dist-e2e
          path: frontend/dist/aqfish/browser
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: e2e ${{ matrix.shard }}/7
    needs: build-e2e
    runs-on: ubuntu-latest
    # Délai historique de 45 min (#248). Les parts duraient 21 à 36 min avant l'ADR 0151 ;
    # à abaisser une fois les nouvelles durées mesurées (`e2e/durees.json`).
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Installer Chromium pour Playwright
        run: |
          # Les miroirs apt du runner tombent parfois (DNS, #577) : trois essais espacés.
          for essai in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "::warning::Installation de Chromium en échec (essai $essai sur 3), nouvel essai dans 30 s"
            sleep 30
          done
          exit 1

      - name: Récupérer le build
        uses: actions/download-artifact@v7
        with:
          name: dist-e2e
          path: frontend/dist-e2e

      - name: Tests de bout en bout (part ${{ matrix.shard }} sur 7)
        run: npm run e2e -- --shard=${{ matrix.shard }}/7
        env:
          E2E_DIST: dist-e2e

      - name: Publier le rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  captures:
    name: captures sous 5 angles
    needs: build-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Installer Chromium pour Playwright
        run: |
          # Les miroirs apt du runner tombent parfois (DNS, #577) : trois essais espacés.
          for essai in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "::warning::Installation de Chromium en échec (essai $essai sur 3), nouvel essai dans 30 s"
            sleep 30
          done
          exit 1

      - name: Récupérer le build
        uses: actions/download-artifact@v7
        with:
          name: dist-e2e
          path: frontend/dist-e2e

      - name: Captures sous 5 angles
        run: npm run captures
        env:
          CAPTURE_DIR: ${{ github.workspace }}/captures-ci
          E2E_DIST: dist-e2e

      - name: Publier les captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: captures
          path: captures-ci
          if-no-files-found: ignore
          retention-days: 14

      - name: Publier le rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-captures
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  messages:
    name: messages de commit sans attribution
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # La fusion en squash reprend les messages de tous les commits de la PR : une ligne
      # d'attribution dans un seul commit finit dans l'historique de `main` (CLAUDE.md).
      - name: Aucun commit de la PR ne porte de ligne d'attribution
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          motif='^(co-authored-by|cl[a]ude-session):|cl[a]ude\.(ai|com)/code|generated (with|by)'
          if git log "$BASE..$HEAD" --format='%h %B' | grep -i -E "$motif"; then
            echo "::error::Ligne d'attribution dans un commit de la PR : réécrire les messages (CLAUDE.md, Règles Git)."
            exit 1
          fi
          echo "Aucune ligne d'attribution."

  frontend:
    name: frontend
    needs: [verifier, build-e2e, e2e, captures, messages]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tous les contrôles doivent réussir
        env:
          VERIFIER: ${{ needs.verifier.result }}
          BUILD_E2E: ${{ needs.build-e2e.result }}
          E2E: ${{ needs.e2e.result }}
          CAPTURES: ${{ needs.captures.result }}
          MESSAGES: ${{ needs.messages.result }}
        run: |
          echo "vérifications : $VERIFIER ; build : $BUILD_E2E ; e2e : $E2E ; captures : $CAPTURES ; messages : $MESSAGES"
          test "$VERIFIER" = success
          test "$BUILD_E2E" = success
          test "$E2E" = success
          test "$CAPTURES" = success
          # « skipped » hors pull request (push sur main).
          test "$MESSAGES" = success -o "$MESSAGES" = skipped
