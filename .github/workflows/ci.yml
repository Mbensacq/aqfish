name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Les tests de bout en bout (rendu WebGL logiciel, un seul worker) sont répartis sur
# plusieurs machines en parallèle (`--shard`). Le job `frontend` regroupe les résultats :
# c'est le contrôle exigé par la protection de `main`, son nom ne doit pas changer.
jobs:
  verifier:
    name: formatage, lint, tests unitaires, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Formatage
        run: npm run format:check

      - name: Lint (dont frontières d'architecture et déterminisme)
        run: npm run lint

      - name: Tests unitaires avec couverture
        run: npm run test:coverage

      - name: Build de production
        run: npm run build

  e2e:
    name: e2e ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    # L'installation de Chromium (paquets système) prend parfois 8 à 12 min sur certains
    # runners (#248) : marge de 45 min et 6 parts pour rester loin du délai.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Installer Chromium pour Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests de bout en bout (part ${{ matrix.shard }} sur 6)
        run: npm run e2e -- --shard=${{ matrix.shard }}/6

      - name: Publier le rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  captures:
    name: captures sous 5 angles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Installer Chromium pour Playwright
        run: npx playwright install --with-deps chromium

      - name: Captures sous 5 angles
        run: npm run captures
        env:
          CAPTURE_DIR: ${{ github.workspace }}/captures-ci

      - name: Publier les captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: captures
          path: captures-ci
          if-no-files-found: ignore
          retention-days: 14

      - name: Publier le rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-captures
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  messages:
    name: messages de commit sans attribution
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # La fusion en squash reprend les messages de tous les commits de la PR : une ligne
      # d'attribution dans un seul commit finit dans l'historique de `main` (CLAUDE.md).
      - name: Aucun commit de la PR ne porte de ligne d'attribution
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          motif='^(co-authored-by|cl[a]ude-session):|cl[a]ude\.(ai|com)/code|generated (with|by)'
          if git log "$BASE..$HEAD" --format='%h %B' | grep -i -E "$motif"; then
            echo "::error::Ligne d'attribution dans un commit de la PR : réécrire les messages (CLAUDE.md, Règles Git)."
            exit 1
          fi
          echo "Aucune ligne d'attribution."

  frontend:
    name: frontend
    needs: [verifier, e2e, captures, messages]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tous les contrôles doivent réussir
        env:
          VERIFIER: ${{ needs.verifier.result }}
          E2E: ${{ needs.e2e.result }}
          CAPTURES: ${{ needs.captures.result }}
          MESSAGES: ${{ needs.messages.result }}
        run: |
          echo "vérifications : $VERIFIER ; e2e : $E2E ; captures : $CAPTURES ; messages : $MESSAGES"
          test "$VERIFIER" = success
          test "$E2E" = success
          test "$CAPTURES" = success
          # « skipped » hors pull request (push sur main).
          test "$MESSAGES" = success -o "$MESSAGES" = skipped
